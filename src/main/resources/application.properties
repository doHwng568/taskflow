spring.application.name=TaskFlow

# Server Port (Render sets $PORT dynamically)
server.port=${PORT:8080}

# ===============================
# DATABASE - MySQL / TiDB Cloud
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/task_flow?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=VeryStrong

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# MYSQL DRIVER
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JWT & SECURITY
# ===============================
jwt.secret=${JWT_SECRET:day-la-secret-jwt-key-bao-mat-taskflow}
jwt.expiration=15

# ===============================
# CORS (Comma separated allowed origins)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# FILE / PAYLOAD UPLOAD LIMITS
# ===============================
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
